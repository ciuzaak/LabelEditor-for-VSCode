name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The extension handles Windows paths, shells and file locking
        # differently, so run the suite on all three platforms.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `node --test` with a glob pattern needs Node 21+.
          node-version: 22
          cache: npm

      # No dependency needs an install script (vsce's optional keytar does not
      # matter for CI), so skip them.
      - run: npm ci --ignore-scripts

      - name: Type-check and build
        run: npm run compile

      - name: Unit tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python scripts compile
        run: python -m py_compile scripts/sam_service.py scripts/onnx_batch_infer.py

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # vsce runs vscode:prepublish (clean + compile) and validates the manifest.
      - run: npx vsce package --out labeleditor-vscode.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: labeleditor-vscode-vsix
          path: labeleditor-vscode.vsix
          if-no-files-found: error
